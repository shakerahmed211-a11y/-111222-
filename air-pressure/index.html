<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محتوى الهواء بطريقة الضغط — ASTM C231/C231M-26</title>
<style>
:root{--bg:#e4e1da;--cd:#f7f5f0;--ink:#1d2630;--st:#2c5470;--am:#c98a1b;--ok:#2f8f5f;--er:#b8433a;--ln:#c9c4b8}

.tg{background:var(--am);color:#fff;padding:1px 8px;border-radius:3px;font-size:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.g2{grid-template-columns:1fr}}

<header><a href="../" style="color:#fff;text-decoration:none">← الرئيسية</a><h1>محتوى الهواء بطريقة الضغط — ASTM C231/C231M – 26 <small style="font-weight:400;font-size:13px;opacity:.85">| تصميم: أحمد شاكر</small></h1><div id="h"></div><button onclick="if(confirm('مسح التقدم والبدء من جديد؟')){localStorage.removeItem('sta_c231');S=null;hud();start()}">إعادة من البداية</button></header><div id="pb"><div id="pr"></div></div><nav id="nv"></nav><main id="m"></main><div id="pa"></div>
<script>
const $=s=>document.querySelector(s),M=$('#m'),R=a=>a[Math.random()*a.length|0],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let S;try{S=JSON.parse(localStorage.getItem('sta_c231'))}catch(e){}
const sv=()=>{try{localStorage.setItem('sta_c231',JSON.stringify(S))}catch(e){}};
let ac;function snd(f,d=.12){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const good=()=>snd(660),bad=()=>snd(170,.3);
function hud(){$('#h').textContent=S?`${S.name} | ${{t:'تدريب',p:'تطبيق',c:'تحدٍّ'}[S.mode]} | المستوى ${(1+S.xp/100)|0} | الخبرة ${S.xp} | الأخطاء ${S.err}`:'';$('#pr').style.width=S?(S.st/ST.length*100)+'%':'0';$('#nv').innerHTML=S?ST.map((n,i)=>`<button class="${i==S.st?'on':''}" ${i>S.mx?'disabled':''} onclick="go(${i})">${n}</button>`).join(''):''}
function go(i){S.st=i;S.mx=Math.max(S.mx,i);sv();hud();FN[i]()}
const nxt=()=>go(S.st+1);
let FL=[],MS=[];
function quiz(L,done,i=0,r=0){if(i>=L.length){done(r);return}
const [qq,oo,a,w,tp,c,h,s]=L[i],o=sh(oo.map((x,k)=>[x,k]));let f=0;
M.innerHTML=`<div class=card><small>سؤال ${i+1}/${L.length} <span class=tg>${s||'ASTM'}</span></small><h3>${qq}</h3><div>${o.map((x,j)=>`<button class=op data-j=${j}>${x[0]}</button>`).join('')}</div><div id=f>${S.mode=='t'&&h?`<p class=hint>تلميح: ${h}</p>`:''}</div></div>`;
const all=()=>M.querySelectorAll('.op');
all().forEach(b=>b.onclick=()=>{const k=o[b.dataset.j][1],nx=`<button class=pri id=nx>التالي</button>`,bn=()=>{$('#nx').onclick=()=>quiz(L,done,i+1,r)};
if(k==a){good();b.classList.add('ok');if(!f){r++;S.xp+=S.mode=='t'?6:10}all().forEach(x=>x.disabled=1);$('#f').innerHTML=`<div class="fb g"><b>✓ صحيح.</b> ${w}</div>${nx}`;hud();sv();bn()}
else{bad();if(!f){f=1;S.err++;MS.push(tp);if(c)FL.push(tp)}b.classList.add('no');b.disabled=1;hud();
if(S.mode=='t')$('#f').innerHTML=`<div class="fb b"><b>✗ ليست الإجابة.</b> ${w}<br>جرّب إجابة أخرى.</div>`;
else{all().forEach(x=>{x.disabled=1;if(o[x.dataset.j][1]==a)x.classList.add('ok')});$('#f').innerHTML=`<div class="fb b"><b>✗ الإجابة الصحيحة بالأخضر.</b> ${w}</div>${nx}`;bn()}}})}

function pr(h){$('#pa').innerHTML=h}
const fm=m=>`<div class="fb b"><b>✗ ${m[0]}</b><br>السبب: ${m[1]}<br>الصحيح: ${m[2]}<br>الأثر: ${m[3]}</div>`;
function it(h,t,L,b){M.innerHTML=`<div class=card><h2>${h}</h2><p>${t}</p><button class=pri id=b>ابدأ</button></div>`;$('#b').onclick=()=>quiz(L,()=>{S.xp+=b;nxt()})}
function ord(L,cb,h){let ch=[];const E=sh(L.map((x,i)=>i));function dr(){M.innerHTML=`<div class=card><h3>${h}</h3><ol>${ch.map(i=>`<li>${L[i]}</li>`).join('')}</ol>${E.filter(i=>!ch.includes(i)).map(i=>`<button class=op data-i=${i}>${L[i]}</button>`).join('')}<button id=u>تراجع</button><button class=pri id=k ${ch.length<L.length?'disabled':''}>تحقق</button><div id=f></div></div>`;
M.querySelectorAll('.op').forEach(b=>b.onclick=()=>{ch.push(+b.dataset.i);dr()});$('#u').onclick=()=>{ch.pop();dr()};$('#k').onclick=()=>cb(ch.filter((x,i)=>x==i).length)}dr()}



const ST=['المهمة','المعايرة','معامل الركام','التنفيذ','الحساب','الامتحان'];
const FN=[s0,s1,s2,s3,s4,s5];
function start(){M.innerHTML=`<div class=card><h2>مختبر الموقع: أنت فني قياس الهواء</h2><p><b>تصميم اللعبة: أحمد شاكر</b></p><p>تتعلم قياس محتوى الهواء في الخرسانة الطازجة بطريقة الضغط وفق <b>ASTM C231/C231M – 26</b> (النسخة المرفقة)، بمقياسي Type A وType B. الوسوم: <span class=tg>ASTM</span> متطلب المواصفة، <span class=tg>مشروع</span> متطلب خاص بالمشروع، <span class=tg>ممارسة</span> توضيح مختبري. أرقام المحاكاة توضيحية.</p><label>اسم الفني<input id=nm value="${S?S.name:''}"></label><div><button class=pri onclick="beg('t')">وضع التدريب</button><button onclick="beg('p')">وضع التطبيق</button><button onclick="beg('c')">وضع التحدي</button></div>${S?`<button class=pri onclick="go(S.st)">استكمال من «${ST[S.st]}»</button>`:''}</div>`}
function beg(m){const n=$('#nm').value.trim();if(!n){alert('اكتب اسمك أولاً');return}S={name:n,mode:m,st:0,mx:0,xp:0,err:0};go(0)}
function calc(h,intro,L,bt,bank,cb){const tr=S.mode=='t';
M.innerHTML=`<div class=card><h2>${h}</h2>${intro}${L.map(x=>`<label>${x[1]}<input id=i_${x[0]} type=number step=any></label>`).join('')}<button class=pri id=ck>تحقق</button><div id=f></div></div>`;
$('#ck').onclick=()=>{const w=L.filter(x=>{const v=parseFloat($('#i_'+x[0]).value);return isNaN(v)||Math.abs(v-x[2])>x[3]});S.err+=w.length;hud();
if(w.length){bad();$('#f').innerHTML=w.map(x=>fm(['حساب غير صحيح: '+x[1],'المعادلة: '+x[4],tr?'القيمة الصحيحة ≈ '+x[2].toFixed(2):'أعد الحساب بهذه المعادلة','نتيجة خاطئة'])).join('');return}
good();S.xp+=50;if(cb)cb();hud();sv();$('#ck').disabled=1;$('#f').innerHTML=`<div class="fb g"><b>✓ كل الحسابات صحيحة.</b></div><button class=pri id=nx>${bt}</button>`;$('#nx').onclick=()=>quiz(bank,()=>{S.xp+=20;nxt()})}}
// ---- بنوك الأسئلة: [سؤال، خيارات، رقم الصحيح، تفسير، موضوع، حرج، تلميح، مصدر]
const B0=[['ما المبدأ الذي يقوم عليه الاختبار؟',['قانون بويل: تغيّر حجم الهواء مع تغيّر الضغط','قانون أوم','التسخين','التبخير'],0,'البندان 1.1 و4.1.','مفاهيم',0],
['هل يقيس الاختبار الهواء داخل مسام الركام؟',['لا: يستبعده، ولذلك يناسب الركام الكثيف','نعم','في الركام الخفيف فقط','في الأسمنت فقط'],0,'البند 3.1.','مفاهيم',0],
['ما الطريقة البديلة للخرسانة ذات الركام الخفيف أو عالي المسامية؟',['الطريقة الحجمية C173','C231 نفسها','C143','C1064'],0,'البند 1.2.','مفاهيم',1],
['هل يصلح الاختبار لخرسانة غير لدنة كخرسانة الأنابيب؟',['لا ينطبق','نعم','في الصيف فقط','للأسمنت فقط'],0,'البند 1.2.','مفاهيم',0],
['ما نوعا المقياس في المواصفة؟',['Type A (عمود ماء) وType B (غرفة هواء ومؤشر ضغط)','Type 1 وType 2','رقمي وتناظري فقط','لا تصنيف'],0,'البند 4.1.','مفاهيم',0]];
const B1=[['ما الحد الأدنى لسعة وعاء المقياس؟',['6.0 لتر [0.20 ft³]','2 لتر','14 لتراً','28 لتراً'],0,'البند 4.2.','المعايرة',1],
['ما نسبة قطر الوعاء إلى ارتفاعه؟',['من 0.75 إلى 1.25 مرة الارتفاع','من 2 إلى 3','0.25','لا شرط'],0,'البند 4.2.','المعايرة',0],
['ما أقصى معامل تمدد D مسموح للجهاز؟',['0.1% من محتوى الهواء على التدريج','1%','5%','لا حد'],0,'البند 4.2.','المعايرة',0],
['كل كم تُجرى معايرة الجهاز على الأكثر؟',['على فترات لا تتجاوز 3 أشهر','كل سنة','كل 5 سنوات','عند الشراء فقط'],0,'البند 5.1.','المعايرة',1],
['متى تلزم إعادة معايرة Type A؟',['عند تغيّر الارتفاع بأكثر من 180 م [600 ft] عن مكان آخر معايرة','عند تغيير الفني','عند تغيير الخرسانة','لا تلزم'],0,'البند 5.1.','المعايرة',0],

['ما المدى الأدنى لتدريج قراءة الهواء؟',['8% على الأقل مقروءة لأقرب 0.1%','2%','20%','لا شرط'],0,'البند 4.3.2.','المعايرة',0],
['ماذا تتضمن سجلات المعايرة؟',['معامل التمدد وحجم وعاء المعايرة وقراءة المقياس عند نقطة المعايرة','اسم الشاحنة','الهبوط','الحرارة'],0,'البند 5.2.','المعايرة',0],

['كم يبقى الركام مغموراً قبل تحديد G؟',['زمناً يقارب الفترة بين إدخال الماء للخلاطة ووقت الاختبار','ثوانٍ','ساعة ثابتة','لا يهم'],0,'البند 6.4.1.','معامل الركام',0],
['كيف يُحسب G لمقياس Type A؟',['G = h1 − h2','G = h1 + h2','G = h1 × h2','G = h2 − h1'],0,'البند 6.4.2.','معامل الركام',0],
['كيف يُحصل على G لمقياس Type B؟',['قراءة المقياس ناقص الماء المسحوب كنسبة من حجم الوعاء','قراءة المقياس فقط','الماء المسحوب فقط','صفر'],0,'البند 6.4.3.','معامل الركام',0]];
const B3=[['هبوط 110 مم: ما طريقة الدمك؟',['القضيب','الاهتزاز فقط','أي منهما','لا دمك'],0,'البند 8.1.3.','التنفيذ',1],
['هبوط 15 مم: ما طريقة الدمك؟',['الاهتزاز','القضيب','أي منهما','لا دمك'],0,'البند 8.1.3.','التنفيذ',1],
['ما عدد طبقات القضيب وضرباتها؟',['3 طبقات و25 ضربة لكل طبقة','طبقتان و25','3 طبقات و10','4 طبقات و50'],0,'البند 8.1.4.','التنفيذ',1],
['ما عدد الطبقات والإدخالات عند الاهتزاز؟',['طبقتان وثلاث إدخالات لكل طبقة','3 طبقات وإدخال واحد','طبقة واحدة','5 إدخالات'],0,'البند 8.1.5.','التنفيذ',0],
['ماذا تفعل بعد دمك كل طبقة بالقضيب؟',['النقر على جوانب الوعاء بالمطرقة 10–15 مرة','لا شيء','نقر 3 مرات','هز الوعاء'],0,'البند 8.1.4.','التنفيذ',0],
['كم يُزال عادةً أثناء التسوية؟',['نحو 3 مم','50 مم','لا شيء','10 مم'],0,'البند 8.1.6.','التنفيذ',0],
['لماذا تُنظَّف حواف الوعاء والغطاء؟',['لإحكام يتحمل الضغط','للمظهر','لتقليل الوزن','لا سبب'],0,'البند 8.2.1.','التنفيذ',0],

['Type B: لماذا يُغلق صمام الهواء الرئيسي قبل تفريغ الضغط؟',['وإلا يُسحب الماء إلى غرفة الهواء فيفسد القياس','للتوفير','للصوت','لا سبب'],0,'البند 8.3.2.','التنفيذ',0],

const B4=[['لأي دقة تُبلَّغ نسبة الهواء؟',['أقرب 0.1% بعد طرح G','أقرب 1%','أقرب 0.01%','أقرب 5%'],0,'البند 10.1.1.','الحساب',0],
['قراءة المؤشر الدائري تجاوزت 8%: كيف تُبلَّغ؟',['تُقرَّب القراءة المصحّحة لأقرب نصف قسم من التدريج','لأقرب 0.1','لأقرب 1','لا تُبلَّغ'],0,'البند 10.1.1.','الحساب',0],

['متى تُحسب الخلطة الكاملة At بالمعادلة (6)؟',['حين تكون العينة مغربلة رطباً على منخل 37.5 مم','دائماً','أبداً','للخرسانة الخفيفة'],0,'البند 9.2.','الحساب',0],
['اختباران متتاليان على Type A كان فرقهما 0.5% هواء. الحكم؟',['غير متفقين (الحد 0.2%) فيُعاد','مقبول','يُؤخذ المتوسط','يُؤخذ الأول'],0,'البند 8.2.4.','المراقبة',1],

function s2(){const B=R([.5,1]),Fb=R([760,800])*B,Cb=R([1050,1000])*B,Fs=.007/B*Fb,Cs=.007/B*Cb,h1=R([1.2,1.4,1.6]),h2=R([.5,.6,.7,.8]);

function s3(){const TA=Math.random()<.5,SL=R([15,50,110]),tr=S.mode=='t',o=a=>a.map(x=>`<option>${x}</option>`).join(''),sel=(id,l,a)=>`<label>${l}<select id=${id}>${o(a)}</select></label>`;

function s4(){const A1=R([6.2,6.6,7.0,7.4]),G=R([.6,.8,1.0]),As=A1-G,Va=R([.2,.22,.25]),Vt=.95,Vc=Vt-Va,At=100*As*Vc/(100*Vt-As*Va);

function res(p,tot){const pc=Math.round(p/tot*100),cr=[...new Set(FL)],ms=[...new Set(MS)],pass=pc>=80&&!cr.length&&S.ok1&&S.ok2,why=[];
