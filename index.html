<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>درجة حرارة الخرسانة الطازجة — ASTM C1064/C1064M-23</title>
<style>

main{max-width:980px;margin:14px auto;padding:0 12px}.card{background:var(--cd);border:1px solid var(--ln);border-radius:6px;padding:18px}
button{font:inherit;border:1px solid var(--st);background:#fff;color:var(--st);border-radius:4px;padding:8px 14px;cursor:pointer;margin:3px}
button:disabled{opacity:.45;cursor:default}button.pri{background:var(--st);color:#fff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--am)}
.op{display:block;width:100%;text-align:right}.ok{background:#d5eedf!important;border-color:var(--ok)!important;color:#145a37!important}.no{background:#f4d9d5!important;border-color:var(--er)!important;color:#7d2219!important}.sel{background:var(--st);color:#fff}
.fb{padding:10px 14px;border-radius:4px;margin:10px 0;border-inline-start:5px solid}.g{background:#e3f3ea;border-color:var(--ok)}.b{background:#f8e4e1;border-color:var(--er)}.hint{color:#7a5300}
.tg{background:var(--am);color:#fff;padding:1px 8px;border-radius:3px;font-size:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.g2{grid-template-columns:1fr}}
.sv{width:100%;max-height:300px;background:#cfd6db;border-radius:4px}label{display:block;margin:6px 0;font-size:14px}input,select,textarea{font:inherit;width:100%;padding:6px;border:1px solid var(--ln);border-radius:4px}input[type=range]{padding:0}
.ctl{background:#ecebe5;padding:8px;border-radius:4px;margin-bottom:8px}.nx{box-shadow:0 0 0 3px var(--am)}.eq{display:inline-block;margin:4px;padding:10px 12px}
.sl path{transform-box:fill-box;transform-origin:50% 100%;animation:sk 1s ease-out}@keyframes sk{from{transform:scaleY(1.5)}}
#pa{max-width:820px;margin:12px auto}.rep{background:#fff;border:2px solid var(--st);padding:20px}.rep td{border:1px solid var(--ln);padding:6px}.rep table{width:100%;border-collapse:collapse}
@media(prefers-reduced-motion:reduce){.sl path{animation:none}}@media print{.pp header,.pp nav,.pp #pb,.pp main{display:none}}
.trk{position:relative;height:22px;background:#d6d2c8;border-radius:4px;overflow:hidden;margin:10px 0}#bar{position:absolute;top:0;right:0;height:100%;width:0;background:#2c5470;opacity:.55}.z{position:absolute;top:0;height:100%;background:#b8433a40}.mk{position:absolute;top:0;width:4px;height:100%;background:#c98a1b}</style></head><body>
<header><a href="../" style="color:#fff;text-decoration:none">← الرئيسية</a><h1>درجة حرارة الخرسانة الطازجة — ASTM C1064/C1064M – 23 <small style="font-weight:400;font-size:13px;opacity:.85">| تصميم: أحمد شاكر</small></h1><div id="h"></div><button onclick="if(confirm('مسح التقدم والبدء من جديد؟')){localStorage.removeItem('sta_c1064');S=null;hud();start()}">إعادة من البداية</button></header><div id="pb"><div id="pr"></div></div><nav id="nv"></nav><main id="m"></main><div id="pa"></div>
<script>
const $=s=>document.querySelector(s),M=$('#m'),R=a=>a[Math.random()*a.length|0],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let S;try{S=JSON.parse(localStorage.getItem('sta_c1064'))}catch(e){}
const sv=()=>{try{localStorage.setItem('sta_c1064',JSON.stringify(S))}catch(e){}};
let ac;function snd(f,d=.12){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const good=()=>snd(660),bad=()=>snd(170,.3);
function hud(){$('#h').textContent=S?`${S.name} | ${{t:'تدريب',p:'تطبيق',c:'تحدٍّ'}[S.mode]} | المستوى ${(1+S.xp/100)|0} | الخبرة ${S.xp} | الأخطاء ${S.err}`:'';$('#pr').style.width=S?(S.st/ST.length*100)+'%':'0';$('#nv').innerHTML=S?ST.map((n,i)=>`<button class="${i==S.st?'on':''}" ${i>S.mx?'disabled':''} onclick="go(${i})">${n}</button>`).join(''):''}
function go(i){S.st=i;S.mx=Math.max(S.mx,i);sv();hud();FN[i]()}
const nxt=()=>go(S.st+1);
let FL=[],MS=[];
function quiz(L,done,i=0,r=0){if(i>=L.length){done(r);return}
const [qq,oo,a,w,tp,c,h,s]=L[i],o=sh(oo.map((x,k)=>[x,k]));let f=0;
M.innerHTML=`<div class=card><small>سؤال ${i+1}/${L.length} <span class=tg>${s||'ASTM'}</span></small><h3>${qq}</h3><div>${o.map((x,j)=>`<button class=op data-j=${j}>${x[0]}</button>`).join('')}</div><div id=f>${S.mode=='t'&&h?`<p class=hint>تلميح: ${h}</p>`:''}</div></div>`;
const all=()=>M.querySelectorAll('.op');
all().forEach(b=>b.onclick=()=>{const k=o[b.dataset.j][1],nx=`<button class=pri id=nx>التالي</button>`,bn=()=>{$('#nx').onclick=()=>quiz(L,done,i+1,r)};
if(k==a){good();b.classList.add('ok');if(!f){r++;S.xp+=S.mode=='t'?6:10}all().forEach(x=>x.disabled=1);$('#f').innerHTML=`<div class="fb g"><b>✓ صحيح.</b> ${w}</div>${nx}`;hud();sv();bn()}
else{bad();if(!f){f=1;S.err++;MS.push(tp);if(c)FL.push(tp)}b.classList.add('no');b.disabled=1;hud();
if(S.mode=='t')$('#f').innerHTML=`<div class="fb b"><b>✗ ليست الإجابة.</b> ${w}<br>جرّب إجابة أخرى.</div>`;
else{all().forEach(x=>{x.disabled=1;if(o[x.dataset.j][1]==a)x.classList.add('ok')});$('#f').innerHTML=`<div class="fb b"><b>✗ الإجابة الصحيحة بالأخضر.</b> ${w}</div>${nx}`;bn()}}})}

function pr(h){$('#pa').innerHTML=h}
const fm=m=>`<div class="fb b"><b>✗ ${m[0]}</b><br>السبب: ${m[1]}<br>الصحيح: ${m[2]}<br>الأثر: ${m[3]}</div>`;
function it(h,t,L,b){M.innerHTML=`<div class=card><h2>${h}</h2><p>${t}</p><button class=pri id=b>ابدأ</button></div>`;$('#b').onclick=()=>quiz(L,()=>{S.xp+=b;nxt()})}
function ord(L,cb,h){let ch=[];const E=sh(L.map((x,i)=>i));function dr(){M.innerHTML=`<div class=card><h3>${h}</h3><ol>${ch.map(i=>`<li>${L[i]}</li>`).join('')}</ol>${E.filter(i=>!ch.includes(i)).map(i=>`<button class=op data-i=${i}>${L[i]}</button>`).join('')}<button id=u>تراجع</button><button class=pri id=k ${ch.length<L.length?'disabled':''}>تحقق</button><div id=f></div></div>`;
M.querySelectorAll('.op').forEach(b=>b.onclick=()=>{ch.push(+b.dataset.i);dr()});$('#u').onclick=()=>{ch.pop();dr()};$('#k').onclick=()=>cb(ch.filter((x,i)=>x==i).length)}dr()}

const ST=['المهمة','الجهاز','العينة والوعاء','القياس','المراقب','الامتحان'];
const FN=[s0,s1,s2,s3,s4,s5];
function start(){M.innerHTML=`<div class=card><h2>مختبر الموقع: أنت فني قياس الحرارة</h2><p><b>تصميم اللعبة: أحمد شاكر</b></p><p>تتعلم قياس درجة حرارة الخرسانة الطازجة وفق <b>ASTM C1064/C1064M – 23</b> (النسخة المرفقة). الوسوم: <span class=tg>ASTM</span> متطلب المواصفة، <span class=tg>مشروع</span> متطلب خاص بالمشروع، <span class=tg>ممارسة</span> توضيح مختبري. القيم العشوائية في المحاكاة توضيحية.</p><label>اسم الفني<input id=nm value="${S?S.name:''}"></label><div><button class=pri onclick="beg('t')">وضع التدريب</button><button onclick="beg('p')">وضع التطبيق</button><button onclick="beg('c')">وضع التحدي</button></div>${S?`<button class=pri onclick="go(S.st)">استكمال من «${ST[S.st]}»</button>`:''}</div>`}
function beg(m){const n=$('#nm').value.trim();if(!n){alert('اكتب اسمك أولاً');return}S={name:n,mode:m,st:0,mx:0,xp:0,err:0};go(0)}
// ---- بنوك الأسئلة: [سؤال، خيارات، رقم الصحيح، تفسير، موضوع، حرج، تلميح، مصدر]
const B0=[['ماذا تمثل القراءة الناتجة عن الاختبار؟',['حرارة الخرسانة لحظة الاختبار، وقد لا تعبّر عن حرارتها لاحقاً','حرارتها عند الصب النهائي دائماً','حرارة الجو','حرارة الأسمنت'],0,'البند 4.1: القراءة تمثل لحظة الاختبار.','مفاهيم',0,'فكّر في «لحظة الاختبار».'],
['فيمَ تُستخدم النتيجة؟',['للتحقق من مطابقة متطلب حرارة الخرسانة المحدد في المواصفات','لتحديد المقاومة','لتحديد الهبوط','لحساب الهواء'],0,'البند 4.1: التحقق من متطلب محدد؛ والحد المقبول يضعه المشروع لا C1064.','مفاهيم',0,'','مشروع'],
['ركام اسمي أكبر من 75 مم. ما التنبيه الخاص؟',['قد يلزم حتى 20 دقيقة لانتقال الحرارة من الركام إلى الملاط','لا تنبيه','يُلغى الاختبار','يُستخدم جهاز آخر'],0,'البند 4.2.','مفاهيم',0],
['مع أي اختبارات تُسجَّل الحرارة لعينات القبول؟',['مع الهبوط والهواء لكل عينة تُصبّ منها عينات مقاومة للقبول','لا تُسجَّل','في الشتاء فقط','لعينة من كل عشر'],0,'C31 البند 8.1: الهبوط والهواء والحرارة لكل عينة قبول.','مفاهيم',0],
['هل حرارة الوسط المحيط بالعينات تساوي دائماً حرارة الخرسانة؟',['لا: قد تختلف (C31 البند 3.2.4.1) فتُقاس كل منهما على حدة','نعم دائماً','نعم في الصيف','نعم للأسطوانات'],0,'C31 بند 3.2.4.1 (مناقشة).','مفاهيم',0,'','ASTM (ملاحظة)']];
const B1=[['التحقق: المرجع 10.0 و30.0 °م، والجهاز 10.3 و30.4. القرار؟',['الجهاز مقبول (الفروق 0.3 و0.4 ≤ 0.5)','مرفوض','التحقق غير صالح'],0,'البند 6.5: يُرفض الجهاز إن زاد الفرق على 0.5 °م عند أي نقطة.','الجهاز',0],
['التحقق: المرجع 12.0 و32.0 °م، والجهاز 12.2 و32.7. القرار؟',['الجهاز مرفوض (فرق 0.7 > 0.5 عند النقطة الثانية)','مقبول','التحقق غير صالح'],0,'البند 6.5. يُسجَّل رفضه، ويجوز إعادة التحقق بعد ضبطه إن كان قابلاً للضبط.','الجهاز',1],
['التحقق عند 20.0 و30.0 °م فقط. القرار؟',['التحقق غير صالح: النقطتان يجب أن تفترقا 15 °م على الأقل','مقبول','مرفوض الجهاز','يكفي نقطة واحدة'],0,'البند 6.1.','الجهاز',0],
['التحقق: المرجع 15.0 و35.0 °م، والجهاز 15.5 و35.2. القرار؟',['مقبول: الفرق 0.5 لا يتجاوز الحد','مرفوض','غير صالح'],0,'البند 6.5: الرفض عند «تجاوز» 0.5 وليس عند بلوغه.','الجهاز',0],
['آخر تحقق للجهاز كان منذ 14 شهراً. التقييم؟',['مخالف: التحقق كل 12 شهراً على الأقل أو عند الشك في الدقة','سليم','يكفي كل سنتين','يكفي عند الشراء'],0,'البند 6.1.','الجهاز',1],
['ما دقة جهاز المرجع المطلوبة عند نقاط التحقق؟',['±0.2 °م [0.5 °ف]','±1 °م','±2 °م','لا شرط'],0,'البند 5.4 (ويلزم شهادة تتبّع إلى NIST).','الجهاز',0],
['كم يبقى الجهازان في الحمام قبل القراءة عند التحقق؟',['5 دقائق على الأقل','10 ثوانٍ','دقيقة','لا يلزم'],0,'البند 6.3.','الجهاز',0]];
const B2=[['ما أدنى غطاء من الخرسانة حول الحساس في كل الاتجاهات؟',['75 مم، وأيضاً ثلاثة أضعاف الركام الاسمي الأكبر على الأقل','25 مم','50 مم دائماً','10 مم'],0,'البند 5.1.','العينة',1,'الشرطان معاً.'],
['ركام اسمي أكبر 37.5 مم. ما أدنى غطاء؟',['112.5 مم (3 × 37.5 وهو أكبر من 75)','75 مم','37.5 مم','50 مم'],0,'البند 5.1: الأكبر بين 75 مم وثلاثة أضعاف الركام.','العينة',1],
['لن تستخدم وسيلة النقل أو الشدة وعاءً. ماذا تفعل قبل أخذ العينة؟',['ترطيب وعاء العينة بالماء مباشرة قبل الأخذ','تجفيفه','تدفئته','لا شيء'],0,'البند 7.2.1.','العينة',0],
['هل العينة المركّبة مطلوبة إن كان الغرض الوحيد قياس الحرارة؟',['لا: تؤخذ العينة وفق C172 دون تركيبها','نعم دائماً','نعم للركام الكبير','لا تؤخذ عينة'],0,'البند 7.2.2.','العينة',0],
['متى يجوز القياس في وسيلة النقل أو الشدة بعد التفريغ؟',['إذا بقي حول الحساس غطاء 75 مم على الأقل في كل الاتجاهات','دائماً بلا شرط','إذا كانت جافة','إذا كانت مغطاة'],0,'البند 7.1.','العينة',0],
['متى تبدأ اختبار الحرارة بعد أخذ آخر جزء من العينة المركّبة؟',['خلال 5 دقائق (C172 البند 5.1.2)','خلال ساعة','بعد 15 دقيقة','آخر اليوم'],0,'متطلب C172.','العينة',1]];
const B3=[['كم يبقى الجهاز في الخرسانة قبل القراءة؟',['من دقيقتين إلى 5 دقائق','10 ثوانٍ','15 دقيقة','لا يهم'],0,'البند 8.2.','القياس',1],
['كيف تُقرأ الحرارة؟',['والجهاز داخل الخرسانة','بعد إخراجه','بعد وضعه في الماء','بعد مسحه'],0,'البند 8.2: لا يُخرج الجهاز عند القراءة.','القياس',0],
['لأي حد تُقرَّب النتيجة المُبلَّغة؟',['أقرب 0.5 °م (1 °ف)','أقرب 0.1','أقرب 5','أقرب 1 °م فقط'],0,'البند 9.1: كل نظام وحدات مستقل (1.2).','القياس',0],
['لماذا تُضغط الخرسانة برفق حول الحساس؟',['لمنع تأثير حرارة الهواء المحيط على القراءة','لتبريدها','لزيادة الكثافة','للتخلص من الماء'],0,'البند 8.1.','القياس',0],
['ما أدنى عمق غمر للحساس في الخرسانة؟',['75 مم','25 مم','50 مم','10 مم'],0,'البند 8.1 والبند 5.2.','القياس',0],
['أقصى فرق مقبول بين اختبارين لمشغّلين مختلفين على العينة نفسها؟',['1.1 °م [1.9 °ف]','0.1','5.0','لا حد'],0,'البند 10.3 (d2s). ولمشغل واحد 0.7 °م [1.3 °ف] (10.2).','القياس',0]];
const B4=[['قرأ الفني الحرارة بعد دقيقة واحدة. الحكم؟',['مخالف: يلزم دقيقتان على الأقل (8.2)','سليم','سليم إن كان الجو بارداً','يُضاف 1 °م'],0,'البند 8.2.','المراقبة',1],
['أخرج الفني الحساس ليقرأه. الحكم؟',['مخالف: لا يُخرج الجهاز عند القراءة (8.2)','سليم','سليم إن كان سريعاً','يُقبل بملاحظة'],0,'البند 8.2.','المراقبة',0],
['غطاء الخرسانة حول الحساس 50 مم. الحكم؟',['مخالف: الحد 75 مم على الأقل (5.1)','مقبول','مقبول للركام الصغير','يُقاس مرتين'],0,'البند 5.1.','المراقبة',1],
['ترمومتر لم يُتحقق منه منذ 18 شهراً. الحكم؟',['مخالف: التحقق كل 12 شهراً (6.1)','سليم','يُسمح سنتان','يُسمح عند الشراء فقط'],0,'البند 6.1.','المراقبة',1],
['القراءة 33.0 °م والمتطلب «30 °م كحد أقصى» حسب المشروع. ما الصحيح؟',['تُسجَّل كما قيست وتُبلَّغ للمهندس؛ الحكم لمواصفات المشروع','تُخفَّض إلى 30','تُهمل','تُعاد حتى تنخفض'],0,'C1064 تقيس وتُبلّغ فقط ولا تضع حدود قبول.','المراقبة',0,'','مشروع'],
['ترك الفني الحساس 8 دقائق قبل القراءة. الحكم؟',['مخالف: لا تزيد المدة عن 5 دقائق (8.2)','سليم لأنه أدق','سليم','يُقبل إن كان الركام كبيراً'],0,'البند 8.2.','المراقبة',1]];
const OR=['التحقق من أن الجهاز مُتحقَّق منه خلال آخر 12 شهراً','ترطيب وعاء العينة ثم أخذ العينة وفق C172','وضع الخرسانة بغطاء كافٍ حول الحساس','غمر الحساس 75 مم على الأقل','ضغط الخرسانة برفق حول الحساس','الانتظار من 2 إلى 5 دقائق','قراءة الحرارة والجهاز داخل الخرسانة','تسجيل النتيجة لأقرب 0.5 °م'];
// ---- المراحل
function s0(){it('استلام المهمة','المطلوب قياس حرارة خرسانة وصلت للموقع ضمن اختبارات القبول. قراءة خاطئة قد تحكم على صبة بالرفض أو القبول خطأً.',B0,20)}
function s1(){it('التحقق من الجهاز','لا قياس موثوقاً بجهاز غير مُتحقَّق منه. احكم على سيناريوهات التحقق (البند 6).',B1,30)}
function s2(){it('العينة والوعاء','أين تُقاس الحرارة وكيف تُجهَّز العينة والوعاء (البنود 5 و7).',B2,25)}
function s3(){const NM=R([19,25,37.5]),need=Math.max(75,3*NM),raw=R([22.3,24.3,26.7,28.2]),tr=S.mode=='t',op=a=>a.map(x=>`<option value=${x}>${x} مم</option>`).join('');
M.innerHTML=`<div class=card><h2>قياس درجة الحرارة</h2><p>الركام الاسمي الأكبر في هذه الخرسانة: <b>${NM} مم</b>. اضبط إعدادات القياس ثم نفّذ.</p>${tr?`<p class=hint>تلميح: الغطاء المطلوب = الأكبر من 75 مم وثلاثة أضعاف الركام = ${need} مم.</p>`:''}<div class=ctl><label>الغطاء حول الحساس<select id=a1>${op([50,75,100,112.5,125,150])}</select></label><label>عمق غمر الحساس<select id=a2>${op([50,75,100])}</select></label><label>وعاء العينة<select id=a3><option>مرطّب بالماء</option><option>جاف</option></select></label><label>الفراغ حول الحساس<select id=a4><option>ضغط الخرسانة برفق حوله</option><option>تركه مفتوحاً</option></select></label><label>زمن بقاء الجهاز: <output id=o5>1</output> دقيقة<input id=a5 type=range min=.5 max=8 step=.5 value=1></label><label>القراءة<select id=a6><option>والجهاز داخل الخرسانة</option><option>بعد إخراج الجهاز</option></select></label></div><button class=pri id=go>نفّذ القياس</button><div id=f></div></div>`;
$('#a5').oninput=ev=>$('#o5').value=ev.target.value;
$('#go').onclick=()=>{const c=+$('#a1').value,d=+$('#a2').value,t=+$('#a5').value,e=[];
if(c<need)e.push(['غطاء غير كافٍ','5.1: 75 مم على الأقل وثلاثة أضعاف الركام الاسمي الأكبر ('+need+' مم هنا)','غطاء لا يقل عن '+need+' مم','حرارة محيط الوعاء تؤثر في القراءة']);
if(d<75)e.push(['غمر أقل من 75 مم','8.1: غمر 75 مم على الأقل','غمر لا يقل عن 75 مم','القراءة لا تمثل الخرسانة']);
if($('#a3').selectedIndex)e.push(['وعاء جاف','7.2.1: يُرطَّب الوعاء قبل أخذ العينة','رطّب الوعاء','وعاء جاف قد يمتص ماء الخرسانة (توضيحي)']);
if($('#a4').selectedIndex)e.push(['فراغ مفتوح حول الحساس','8.1: اضغط الخرسانة برفق حول الجهاز','أغلق الفراغ','حرارة الهواء المحيط تؤثر في القراءة']);
if(t<2)e.push(['قراءة مبكرة','8.2: دقيقتان على الأقل','انتظر من 2 إلى 5 دقائق','القراءة لم تستقر']);
if(t>5)e.push(['تجاوز 5 دقائق','8.2: لا تزيد عن 5 دقائق','اقرأ خلال 2–5 دقائق','مخالفة حد الزمن']);
if($('#a6').selectedIndex)e.push(['إخراج الجهاز للقراءة','8.2: لا يُخرج الجهاز عند القراءة','اقرأ والجهاز داخل الخرسانة','تتغير القراءة فور الإخراج']);
S.err+=e.length;hud();
if(e.length){bad();$('#f').innerHTML=e.map(fm).join('')+'<div class="fb b">القياس غير مطابق؛ عدّل الإعدادات وأعد.</div>';return}
good();const rc=Math.round(raw*2)/2,rf=Math.round(raw*9/5+32);$('#go').disabled=1;
$('#f').innerHTML=`<div class="fb g">✓ إعدادات مطابقة. الجهاز يعرض <b>${raw.toFixed(1)} °م</b>. سجّل النتيجة للتقرير:</div><label>بالسيلزيوس (لأقرب 0.5)<input id=rc type=number step=.1></label><label>بالفهرنهايت (لأقرب 1، نظام مستقل؛ القيمة توضيحية)<input id=rf type=number></label><button class=pri id=ck>تحقق</button><div id=g></div>`;
$('#ck').onclick=()=>{if(Math.abs(+$('#rc').value-rc)>.01||+$('#rf').value!=rf){bad();S.err++;hud();$('#g').innerHTML=fm(['تقريب خاطئ','9.1: لأقرب 0.5 °م [1 °ف]','قرّب القراءة المعروضة وفق هذا الحد','نتيجة مُبلَّغة غير دقيقة']);return}
good();S.xp+=60;if(S.mode!='t')S.ok2=1;hud();sv();$('#g').innerHTML=`<div class="fb g"><b>✓ ${rc.toFixed(1)} °م [${rf} °ف]</b> — نتيجة صحيحة.</div><button class=pri id=nx>أسئلة القياس</button>`;$('#nx').onclick=()=>quiz(B3,()=>{S.xp+=20;nxt()})}}}
function s4(){it('اختبار المهندس المشرف','سيناريوهات من الموقع: اكتشف الخطأ واتخذ القرار.',B4,30)}
function s5(){M.innerHTML=`<div class=card><h2>الامتحان الشامل</h2><p>14 سؤالاً ثم ترتيب خطوات القياس، بلا تلميحات. الشهادة تشترط ≥80% وعدم الإخفاق في بند جوهري وإنجاز القياس العملي بنجاح في وضع التطبيق أو التحدي.</p><button class=pri id=b>ابدأ الامتحان</button></div>`;
$('#b').onclick=()=>{FL=[];MS=[];const m=S.mode;S.mode='p';const Q=sh([].concat(B0,B1,B2,B3,B4)).slice(0,14);quiz(Q,r=>{S.mode=m;ord(OR,c=>{if(c<5){FL.push('ترتيب الخطوات');MS.push('ترتيب الخطوات')}res(r+Math.round(c/OR.length*3),Q.length+3)},'رتّب خطوات قياس الحرارة')})}}
function res(p,tot){const pc=Math.round(p/tot*100),cr=[...new Set(FL)],ms=[...new Set(MS)],pass=pc>=80&&!cr.length&&S.ok2,why=[];
if(pc<80)why.push('الدرجة دون 80%');if(cr.length)why.push('إخفاق في بنود جوهرية: '+cr.join('، '));if(!S.ok2)why.push('لم تُنجز القياس العملي بنجاح في وضع التطبيق أو التحدي');
if(pass){S.cert=1;S.xp+=100;sv();hud()}
M.innerHTML=`<div class=card><h2>${pass?'اجتزت الامتحان':'لم تتحقق شروط الإتقان'}</h2><p>الدرجة ${p}/${tot} — نسبة الإتقان ${pc}%</p>${why.length?`<div class="fb b">${why.join('<br>')}</div>`:''}<p><b>نقاط القوة:</b> ${['مفاهيم','الجهاز','العينة','القياس','المراقبة'].filter(x=>!ms.includes(x)).join('، ')||'—'}</p><p><b>تحتاج تدريباً في:</b> ${ms.join('، ')||'لا شيء'}</p>${pass?`<button class=pri id=ce>عرض الشهادة</button>`:''}<button onclick=go(3)>إعادة القياس</button><button onclick=s5()>إعادة الامتحان</button></div>`;
if(pass)$('#ce').onclick=()=>{pr(`<div class=rep style="text-align:center"><h1>شهادة إتقان قياس حرارة الخرسانة الطازجة</h1><p>تشهد أكاديمية المختبر بأن</p><h2>${S.name}</h2><p>أتقن إجراء القياس وفق ASTM C1064/C1064M – 23 بنسبة ${pc}% (تدريب تعليمي، وليست شهادة اعتماد رسمية)</p><p>${new Date().toLocaleDateString('ar')} — الخبرة ${S.xp}</p><p>تصميم اللعبة: أحمد شاكر</p></div>`);document.body.classList.add('pp');print();document.body.classList.remove('pp')}}
hud();start();
</script></body></html>
