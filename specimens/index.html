<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صب العينات ومعالجتها في الموقع — ASTM C31/C31M-26a</title>
<style>
:root{--bg:#e4e1da;--cd:#f7f5f0;--ink:#1d2630;--st:#2c5470;--am:#c98a1b;--ok:#2f8f5f;--er:#b8433a;--ln:#c9c4b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 'Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif}
header{background:var(--st);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}#h{font-size:14px}#pb{height:4px;background:#0003}#pr{height:4px;background:var(--am);transition:width .4s}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px;background:#d6d2c8}nav button{white-space:nowrap;font-size:13px;padding:5px 10px}nav .on{background:var(--st);color:#fff}
main{max-width:980px;margin:14px auto;padding:0 12px}.card{background:var(--cd);border:1px solid var(--ln);border-radius:6px;padding:18px}
button{font:inherit;border:1px solid var(--st);background:#fff;color:var(--st);border-radius:4px;padding:8px 14px;cursor:pointer;margin:3px}
button:disabled{opacity:.45;cursor:default}button.pri{background:var(--st);color:#fff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--am)}
.op{display:block;width:100%;text-align:right}.ok{background:#d5eedf!important;border-color:var(--ok)!important;color:#145a37!important}.no{background:#f4d9d5!important;border-color:var(--er)!important;color:#7d2219!important}.sel{background:var(--st);color:#fff}
.fb{padding:10px 14px;border-radius:4px;margin:10px 0;border-inline-start:5px solid}.g{background:#e3f3ea;border-color:var(--ok)}.b{background:#f8e4e1;border-color:var(--er)}.hint{color:#7a5300}
.tg{background:var(--am);color:#fff;padding:1px 8px;border-radius:3px;font-size:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.g2{grid-template-columns:1fr}}
.sv{width:100%;max-height:300px;background:#cfd6db;border-radius:4px}label{display:block;margin:6px 0;font-size:14px}input,select,textarea{font:inherit;width:100%;padding:6px;border:1px solid var(--ln);border-radius:4px}input[type=range]{padding:0}
.ctl{background:#ecebe5;padding:8px;border-radius:4px;margin-bottom:8px}.nx{box-shadow:0 0 0 3px var(--am)}.eq{display:inline-block;margin:4px;padding:10px 12px}
.sl path{transform-box:fill-box;transform-origin:50% 100%;animation:sk 1s ease-out}@keyframes sk{from{transform:scaleY(1.5)}}
#pa{max-width:820px;margin:12px auto}.rep{background:#fff;border:2px solid var(--st);padding:20px}.rep td{border:1px solid var(--ln);padding:6px}.rep table{width:100%;border-collapse:collapse}
@media(prefers-reduced-motion:reduce){.sl path{animation:none}}@media print{.pp header,.pp nav,.pp #pb,.pp main{display:none}}
.trk{position:relative;height:22px;background:#d6d2c8;border-radius:4px;overflow:hidden;margin:10px 0}#bar{position:absolute;top:0;right:0;height:100%;width:0;background:#2c5470;opacity:.55}.z{position:absolute;top:0;height:100%;background:#b8433a40}.mk{position:absolute;top:0;width:4px;height:100%;background:#c98a1b}</style></head><body>
<header><a href="../" style="color:#fff;text-decoration:none">← الرئيسية</a><h1>صب العينات ومعالجتها في الموقع — ASTM C31/C31M – 26a <small style="font-weight:400;font-size:13px;opacity:.85">| تصميم: أحمد شاكر</small></h1><div id="h"></div><button onclick="if(confirm('مسح التقدم والبدء من جديد؟')){localStorage.removeItem('sta_c31');S=null;hud();start()}">إعادة من البداية</button></header><div id="pb"><div id="pr"></div></div><nav id="nv"></nav><main id="m"></main><div id="pa"></div>
<script>
const $=s=>document.querySelector(s),M=$('#m'),R=a=>a[Math.random()*a.length|0],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let S;try{S=JSON.parse(localStorage.getItem('sta_c31'))}catch(e){}
const sv=()=>{try{localStorage.setItem('sta_c31',JSON.stringify(S))}catch(e){}};
let ac;function snd(f,d=.12){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const good=()=>snd(660),bad=()=>snd(170,.3);
function hud(){$('#h').textContent=S?`${S.name} | ${{t:'تدريب',p:'تطبيق',c:'تحدٍّ'}[S.mode]} | المستوى ${(1+S.xp/100)|0} | الخبرة ${S.xp} | الأخطاء ${S.err}`:'';$('#pr').style.width=S?(S.st/ST.length*100)+'%':'0';$('#nv').innerHTML=S?ST.map((n,i)=>`<button class="${i==S.st?'on':''}" ${i>S.mx?'disabled':''} onclick="go(${i})">${n}</button>`).join(''):''}
function go(i){S.st=i;S.mx=Math.max(S.mx,i);sv();hud();FN[i]()}
const nxt=()=>go(S.st+1);
let FL=[],MS=[];
function quiz(L,done,i=0,r=0){if(i>=L.length){done(r);return}
const [qq,oo,a,w,tp,c,h,s]=L[i],o=sh(oo.map((x,k)=>[x,k]));let f=0;
M.innerHTML=`<div class=card><small>سؤال ${i+1}/${L.length} <span class=tg>${s||'ASTM'}</span></small><h3>${qq}</h3><div>${o.map((x,j)=>`<button class=op data-j=${j}>${x[0]}</button>`).join('')}</div><div id=f>${S.mode=='t'&&h?`<p class=hint>تلميح: ${h}</p>`:''}</div></div>`;
const all=()=>M.querySelectorAll('.op');
all().forEach(b=>b.onclick=()=>{const k=o[b.dataset.j][1],nx=`<button class=pri id=nx>التالي</button>`,bn=()=>{$('#nx').onclick=()=>quiz(L,done,i+1,r)};
if(k==a){good();b.classList.add('ok');if(!f){r++;S.xp+=S.mode=='t'?6:10}all().forEach(x=>x.disabled=1);$('#f').innerHTML=`<div class="fb g"><b>✓ صحيح.</b> ${w}</div>${nx}`;hud();sv();bn()}
else{bad();if(!f){f=1;S.err++;MS.push(tp);if(c)FL.push(tp)}b.classList.add('no');b.disabled=1;hud();
if(S.mode=='t')$('#f').innerHTML=`<div class="fb b"><b>✗ ليست الإجابة.</b> ${w}<br>جرّب إجابة أخرى.</div>`;
else{all().forEach(x=>{x.disabled=1;if(o[x.dataset.j][1]==a)x.classList.add('ok')});$('#f').innerHTML=`<div class="fb b"><b>✗ الإجابة الصحيحة بالأخضر.</b> ${w}</div>${nx}`;bn()}}})}

function pr(h){$('#pa').innerHTML=h}
const fm=m=>`<div class="fb b"><b>✗ ${m[0]}</b><br>السبب: ${m[1]}<br>الصحيح: ${m[2]}<br>الأثر: ${m[3]}</div>`;
function it(h,t,L,b){M.innerHTML=`<div class=card><h2>${h}</h2><p>${t}</p><button class=pri id=b>ابدأ</button></div>`;$('#b').onclick=()=>quiz(L,()=>{S.xp+=b;nxt()})}
function ord(L,cb,h){let ch=[];const E=sh(L.map((x,i)=>i));function dr(){M.innerHTML=`<div class=card><h3>${h}</h3><ol>${ch.map(i=>`<li>${L[i]}</li>`).join('')}</ol>${E.filter(i=>!ch.includes(i)).map(i=>`<button class=op data-i=${i}>${L[i]}</button>`).join('')}<button id=u>تراجع</button><button class=pri id=k ${ch.length<L.length?'disabled':''}>تحقق</button><div id=f></div></div>`;
M.querySelectorAll('.op').forEach(b=>b.onclick=()=>{ch.push(+b.dataset.i);dr()});$('#u').onclick=()=>{ch.pop();dr()};$('#k').onclick=()=>cb(ch.filter((x,i)=>x==i).length)}dr()}



function calc(h,intro,L,bt,bank,cb){const tr=S.mode=='t';
M.innerHTML=`<div class=card><h2>${h}</h2>${intro}${L.map(x=>`<label>${x[1]}<input id=i_${x[0]} type=number step=any></label>`).join('')}<button class=pri id=ck>تحقق</button><div id=f></div></div>`;
$('#ck').onclick=()=>{const w=L.filter(x=>{const v=parseFloat($('#i_'+x[0]).value);return isNaN(v)||Math.abs(v-x[2])>x[3]});S.err+=w.length;hud();
if(w.length){bad();$('#f').innerHTML=w.map(x=>fm(['حساب غير صحيح: '+x[1],'المعادلة: '+x[4],tr?'القيمة الصحيحة ≈ '+x[2].toFixed(2):'أعد الحساب بهذه المعادلة','نتيجة خاطئة'])).join('');return}
good();S.xp+=50;if(cb)cb();hud();sv();$('#ck').disabled=1;$('#f').innerHTML=`<div class="fb g"><b>✓ كل الحسابات صحيحة.</b></div><button class=pri id=nx>${bt}</button>`;$('#nx').onclick=()=>quiz(bank,()=>{S.xp+=20;nxt()})}}


const ST=['المهمة','القوالب والحسابات','الصب','المعالجة','المراقب','الامتحان'];
const FN=[s0,s1,s2,s3,s4,s5];
function start(){M.innerHTML=`<div class=card><h2>مختبر الموقع: أنت فني صب العينات</h2><p><b>تصميم اللعبة: أحمد شاكر</b></p><p>تتعلم صب عينات الخرسانة (أسطوانات وكمرات) ومعالجتها ونقلها في الموقع وفق <b>ASTM C31/C31M – 26a</b> (النسخة المرفقة). الوسوم: <span class=tg>ASTM</span> متطلب المواصفة، <span class=tg>مشروع</span> متطلب خاص بالمشروع، <span class=tg>ممارسة</span> توضيح مختبري. أرقام المحاكاة توضيحية.</p><label>اسم الفني<input id=nm value="${S?S.name:''}"></label><div><button class=pri onclick="beg('t')">وضع التدريب</button><button onclick="beg('p')">وضع التطبيق</button><button onclick="beg('c')">وضع التحدي</button></div>${S?`<button class=pri onclick="go(S.st)">استكمال من «${ST[S.st]}»</button>`:''}</div>`}
function beg(m){const n=$('#nm').value.trim();if(!n){alert('اكتب اسمك أولاً');return}S={name:n,mode:m,st:0,mx:0,xp:0,err:0};go(0)}
// ---- بنوك الأسئلة: [سؤال، خيارات، رقم الصحيح، تفسير، موضوع، حرج، تلميح، مصدر]
const B0=[['ما الفرق بين المعالجة القياسية ومعالجة الموقع؟',['القياسية لقبول المقاومة ومراقبة الجودة، ومعالجة الموقع لتقدير مقاومة الخرسانة في المنشأ','لا فرق','معالجة الموقع أدق دائماً','القياسية للمنشأ'],0,'البندان 4.2 و4.3.','مفاهيم',0],
['أي معالجة تُستخدم لعينات قبول المقاومة؟',['القياسية (Standard-cured)','معالجة الموقع','بدون معالجة','هواء المعمل'],0,'البند 4.2.1 وملاحظة 3 (C94 تشترط عينات قبول قياسية المعالجة).','مفاهيم',1],
['لأي خرسانة لا تصلح C31؟',['بلا هبوط قابل للقياس، أو العازلة الخفيفة، أو CLSM','أي خرسانة','العادية','بهبوط 100 مم'],0,'البندان 1.2 و1.3.','مفاهيم',0],
['من يصب عينات القبول؟',['فنيون يستوفون متطلبات تأهيل C1077','أي عامل','المقاول فقط','لا شرط'],0,'البند 6.3.','مفاهيم',0],
['متى تؤخذ العينة بالنسبة لإضافة الماء والمضافات؟',['بعد اكتمال كل التعديلات','قبلها','أثناءها','لا يهم'],0,'البند 7.1.','مفاهيم',1],
['ما الاختبارات المطلوبة مع كل عينة قبول؟',['الهبوط (أو انسياب الهبوط) والهواء والحرارة','الهبوط فقط','الحرارة فقط','لا شيء'],0,'البند 8.1.','مفاهيم',0]];
const B1=[['ركام اسمي أكبر 37.5 مم: ما مقاس أسطوانة القبول؟',['150 × 300 مم','100 × 200 مم','225 × 450 مم','أي مقاس'],0,'البند 6.1.','القوالب',1],
['ركام أقل من 37.5 مم: ما المقاسات المسموحة؟',['150×300 أو 100×200','150×300 فقط','100×200 فقط','أي مقاس'],0,'البند 6.1.','القوالب',0],
['ما نسبة الطول إلى القطر، وأدنى قطر للأسطوانة؟',['الطول ضعف القطر والقطر لا يقل عن 3 أضعاف الركام الاسمي الأكبر','الطول = القطر','القطر = الركام','لا شرط'],0,'البند 6.1.','القوالب',0],
['ما قطر قضيب الدمك لأسطوانة 100 مم؟',['10 ± 2 مم','16 ± 2 مم','25 مم','6 مم'],0,'جدول 1.','القوالب',1],
['ما قطر قضيب الدمك لأسطوانة 150 مم؟',['16 ± 2 مم','10 ± 2 مم','25 مم','6 مم'],0,'جدول 1.','القوالب',1],
['ما حكم القوالب الكرتونية؟',['لا تُستخدم لعينات المعالجة القياسية','تصلح دائماً','تصلح للقبول','أفضل من المعدن'],0,'البند 5.2.','القوالب',1],
['كيف تُحضَّر القوالب المعاد استخدامها؟',['تُدهن بخفة بزيت معدني أو مادة فصل غير متفاعلة','تُترك جافة','تُبلل','تُدهن بشحم سميك'],0,'البند 5.1.','القوالب',0],
['ما كتلة المطرقة؟',['0.6 كجم ± 0.2','2 كجم','100 جم','5 كجم'],0,'البند 5.6.','القوالب',0],
['ما الكمرة القياسية؟',['150 × 150 مم ما لم يُحدَّد غير ذلك، ونسبة العرض إلى العمق لا تتجاوز 1.5','200 × 200','100 × 100 دائماً','لا شرط'],0,'البندان 6.2 و6.2.1.','القوالب',0],
['ركام اسمي أكبر من 50 مم. ماذا يلزم؟',['غربلة رطبة على منخل 50 مم','لا شيء','منخل 25 مم','منخل 12.5 مم'],0,'البندان 6.2.2 و7.2.','القوالب',0]];
const B2=[['هبوط 15 مم: ما طريقة الدمك؟',['الاهتزاز فقط','القضيب','أي منهما','لا دمك'],0,'جدول 3.','الصب',1],
['هبوط 60 مم: ما طريقة الدمك؟',['قضيب أو اهتزاز','قضيب فقط','اهتزاز فقط','لا دمك'],0,'جدول 3.','الصب',0],
['أسطوانة 150 مم بالقضيب: كم طبقة وكم ضربة؟',['3 طبقات و25 ضربة','طبقتان و25','3 و50','4 و25'],0,'جدول 4.','الصب',1],
['أسطوانة 100 مم بالقضيب: كم طبقة وكم ضربة؟',['طبقتان و25 ضربة','3 و25','2 و50','4 و50'],0,'جدول 4.','الصب',1],
['أسطوانة 225 مم بالقضيب؟',['4 طبقات و50 ضربة','3 و25','2 و25','4 و25'],0,'جدول 4.','الصب',0],
['أسطوانة 150 مم بالاهتزاز؟',['طبقتان وإدخالان لكل طبقة','3 طبقات وإدخال','طبقة واحدة','4 إدخالات'],0,'جدول 5.','الصب',0],
['ماذا تفعل بعد دمك كل طبقة بالقضيب؟',['نقر الجوانب 10–15 مرة بالمطرقة (وباليد المفتوحة للقوالب القابلة للتشوه)','لا شيء','هز القالب','نقر 3 مرات'],0,'البند 9.5.1.','الصب',0],
['الكمرات: ماذا بعد النقر؟',['تُغرز كل طبقة بالمالج على الجوانب والأطراف','لا شيء','ترج','تُفرك'],0,'البند 9.5.1.','الصب',0],
['الكمرات: كم ضربة لكل طبقة؟',['واحدة لكل 14 سم² [2 in²] من مساحة السطح العلوي','25','50','حسب الفني'],0,'البند 9.4.','الصب',0],
['ما أقصى فائض للطبقة الأخيرة عند الاهتزاز؟',['لا يزيد عن 6 مم [¼ in]','25 مم','50 مم','لا حد'],0,'البند 9.5.2.','الصب',0],
['ما أقصى بروز أو انخفاض مقبول بعد التشطيب؟',['3.3 مم [1/8 in]','10 مم','1 مم','لا حد'],0,'البند 9.6.','الصب',0],
['أين تُصب العينات؟',['على سطح مستوٍ صلب بلا اهتزاز وقريب من مكان تخزينها','أي مكان','فوق الشاحنة','تحت الشمس'],0,'البند 9.1.','الصب',0],
['هل تُستخدم خرسانة اختبار الهواء في صب العينات؟',['لا تُستخدم','نعم','أحياناً','دائماً'],0,'البند 8.1.2.','الصب',1],
['كيف تُعلَّم العينات؟',['بطريقة لا تغيّر السطح العلوي، ولا يُكتب على الأغطية القابلة للإزالة','على الغطاء','على السطح العلوي','لا تُعلَّم'],0,'البند 9.7.','الصب',0]];
const B3=[['ما مدة المعالجة الابتدائية القياسية؟',['حتى 48 ساعة بعد الصب','7 أيام','24 ساعة بالضبط','ساعة'],0,'البند 10.1.2.','المعالجة',0],
['حرارة المعالجة الابتدائية لمقاومة محددة أقل من 40 MPa؟',['16–27 °م [60–80 °ف]','20–26','10–35','23 ثابتة'],0,'البند 10.1.2.1.','المعالجة',1],
['حرارتها لمقاومة محددة 40 MPa فأكثر؟',['20–26 °م [68–78 °ف]','16–27','10–35','لا شرط'],0,'البند 10.1.2.1.','المعالجة',1],
['ما الاحتياطات أثناء المعالجة الابتدائية؟',['حماية من الشمس والمدفئات ومنع فقد الرطوبة وتسجيل أدنى وأعلى حرارة','لا شيء','تغطية فقط','تعريض للشمس'],0,'البند 10.1.2 (ملاحظة 11: مجرد التغطية غالباً لا يكفي).','المعالجة',0],
['كم تُنقل العينات إلى مكان المعالجة الابتدائية إن لم تُصب فيه؟',['خلال 15 دقيقة من انتهاء الصب','ساعة','4 ساعات','لا شرط'],0,'البند 10.1.1.','المعالجة',0],
['ما الميل المسموح لسطح التخزين؟',['حتى 20 مم/م [¼ in/ft]','100 مم/م','لا ميل','5 مم/م'],0,'البند 10.1.1.','المعالجة',0],
['كيف تكون المعالجة النهائية للأسطوانات؟',['خلال 30 دقيقة من فك القوالب بماء حر دائم عند 23.0 ± 2.0 °م','بعد 3 ساعات في الهواء','عند 30 °م','عند 10 °م'],0,'البند 10.1.3.1.','المعالجة',1],
['ماذا تتطلب الكمرات قبل الاختبار؟',['ماء مشبع بهيدروكسيد الكالسيوم عند 23±2 °م لا يقل عن 20 ساعة، مع منع الجفاف','هواء المعمل','تجفيف','ماء عادي ساعة'],0,'البند 10.1.3.2.','المعالجة',0],
['كمرات معالجة الموقع: متى تُفك قوالبها؟',['بعد 48 ± 4 ساعة من الصب','24 ساعة','7 أيام','فوراً'],0,'البند 10.2.2.','المعالجة',0],
['كمرات الموقع قبل الاختبار؟',['تُغمر في ماء مشبع بالجير 24 ± 4 ساعة','تُجفف','تُغمر ساعة','لا شيء'],0,'البند 10.2.2.','المعالجة',0],
