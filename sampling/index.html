<header><a href="../" style="color:#fff;text-decoration:none">← الرئيسية</a><h1>أخذ عينة الخرسانة الطازجة — ASTM C172/C172M – 25 <small style="font-weight:400;font-size:13px;opacity:.85">| تصميم: أحمد شاكر</small></h1><div id="h"></div><button onclick="if(confirm('مسح التقدم والبدء من جديد؟')){localStorage.removeItem('sta_c172');S=null;hud();start()}">إعادة من البداية</button></header><div id="pb"><div id="pr"></div></div><nav id="nv"></nav><main id="m"></main><div id="pa"></div>
<script>
const $=s=>document.querySelector(s),M=$('#m'),R=a=>a[Math.random()*a.length|0],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let S;try{S=JSON.parse(localStorage.getItem('sta_c172'))}catch(e){}
const sv=()=>{try{localStorage.setItem('sta_c172',JSON.stringify(S))}catch(e){}};
let ac;function snd(f,d=.12){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const good=()=>snd(660),bad=()=>snd(170,.3);
function hud(){$('#h').textContent=S?`${S.name} | ${{t:'تدريب',p:'تطبيق',c:'تحدٍّ'}[S.mode]} | المستوى ${(1+S.xp/100)|0} | الخبرة ${S.xp} | الأخطاء ${S.err}`:'';$('#pr').style.width=S?(S.st/ST.length*100)+'%':'0';$('#nv').innerHTML=S?ST.map((n,i)=>`<button class="${i==S.st?'on':''}" ${i>S.mx?'disabled':''} onclick="go(${i})">${n}</button>`).join(''):''}
function go(i){S.st=i;S.mx=Math.max(S.mx,i);sv();hud();FN[i]()}
const nxt=()=>go(S.st+1);
let FL=[],MS=[];
function quiz(L,done,i=0,r=0){if(i>=L.length){done(r);return}
const [qq,oo,a,w,tp,c,h,s]=L[i],o=sh(oo.map((x,k)=>[x,k]));let f=0;
M.innerHTML=`<div class=card><small>سؤال ${i+1}/${L.length} <span class=tg>${s||'ASTM'}</span></small><h3>${qq}</h3><div>${o.map((x,j)=>`<button class=op data-j=${j}>${x[0]}</button>`).join('')}</div><div id=f>${S.mode=='t'&&h?`<p class=hint>تلميح: ${h}</p>`:''}</div></div>`;
const all=()=>M.querySelectorAll('.op');
all().forEach(b=>b.onclick=()=>{const k=o[b.dataset.j][1],nx=`<button class=pri id=nx>التالي</button>`,bn=()=>{$('#nx').onclick=()=>quiz(L,done,i+1,r)};
if(k==a){good();b.classList.add('ok');if(!f){r++;S.xp+=S.mode=='t'?6:10}all().forEach(x=>x.disabled=1);$('#f').innerHTML=`<div class="fb g"><b>✓ صحيح.</b> ${w}</div>${nx}`;hud();sv();bn()}
else{bad();if(!f){f=1;S.err++;MS.push(tp);if(c)FL.push(tp)}b.classList.add('no');b.disabled=1;hud();
if(S.mode=='t')$('#f').innerHTML=`<div class="fb b"><b>✗ ليست الإجابة.</b> ${w}<br>جرّب إجابة أخرى.</div>`;
else{all().forEach(x=>{x.disabled=1;if(o[x.dataset.j][1]==a)x.classList.add('ok')});$('#f').innerHTML=`<div class="fb b"><b>✗ الإجابة الصحيحة بالأخضر.</b> ${w}</div>${nx}`;bn()}}})}

const ST=['المهمة','أخذ العينة','التوقيت','الغربلة الرطبة','المشرف','الامتحان'];
const FN=[s0,s1,s2,s3,s4,s5];
function start(){M.innerHTML=`<div class=card><h2>مختبر الموقع: أنت فني أخذ العينات</h2><p><b>تصميم اللعبة: أحمد شاكر</b></p><p>تتعلم أخذ عينة الخرسانة الطازجة وفق <b>ASTM C172/C172M – 25</b> (النسخة المرفقة). الوسوم: <span class=tg>ASTM</span> متطلب المواصفة، <span class=tg>مشروع</span> متطلب خاص بالمشروع، <span class=tg>ممارسة</span> توضيح مختبري. الأزمنة في المحاكاة توضيحية.</p><label>اسم الفني<input id=nm value="${S?S.name:''}"></label><div><button class=pri onclick="beg('t')">وضع التدريب</button><button onclick="beg('p')">وضع التطبيق</button><button onclick="beg('c')">وضع التحدي</button></div>${S?`<button class=pri onclick="go(S.st)">استكمال من «${ST[S.st]}»</button>`:''}</div>`}
function beg(m){const n=$('#nm').value.trim();if(!n){alert('اكتب اسمك أولاً');return}S={name:n,mode:m,st:0,mx:0,xp:0,err:0};go(0)}
function pr(h){$('#pa').innerHTML=h}
const fm=m=>`<div class="fb b"><b>✗ ${m[0]}</b><br>السبب: ${m[1]}<br>الصحيح: ${m[2]}<br>الأثر: ${m[3]}</div>`;
function it(h,t,L,b){M.innerHTML=`<div class=card><h2>${h}</h2><p>${t}</p><button class=pri id=b>ابدأ</button></div>`;$('#b').onclick=()=>quiz(L,()=>{S.xp+=b;nxt()})}
function ord(L,cb,h){let ch=[];const E=sh(L.map((x,i)=>i));function dr(){M.innerHTML=`<div class=card><h3>${h}</h3><ol>${ch.map(i=>`<li>${L[i]}</li>`).join('')}</ol>${E.filter(i=>!ch.includes(i)).map(i=>`<button class=op data-i=${i}>${L[i]}</button>`).join('')}<button id=u>تراجع</button><button class=pri id=k ${ch.length<L.length?'disabled':''}>تحقق</button><div id=f></div></div>`;
M.querySelectorAll('.op').forEach(b=>b.onclick=()=>{ch.push(+b.dataset.i);dr()});$('#u').onclick=()=>{ch.pop();dr()};$('#k').onclick=()=>cb(ch.filter((x,i)=>x==i).length)}dr()}

['ما الحد الأدنى لحجم العينة لاختبارات المقاومة؟',['28 لتراً (1 ft³)','10 لترات','50 لتراً','5 لترات'],0,'البند 6.1: 28 L [1 ft³]؛ والأصغر غير ممنوع لاختبارات الهواء والحرارة والهبوط الروتينية، ويُحدَّد الحجم بالركام الأكبر.','مفاهيم',1],

['ما الحد الأقصى بين أخذ أول وآخر جزء من العينة المركّبة؟',['15 دقيقة','5 دقائق','30 دقيقة','ساعة'],0,'البند 5.1.','التوقيت',1],
['متى تبدأ اختبارات الهبوط والحرارة والهواء؟',['خلال 5 دقائق من أخذ آخر جزء للعينة المركّبة','خلال ساعة','بعد نقل العينة للمعمل','في آخر اليوم'],0,'البند 5.1.2.','التوقيت',1],
['متى يبدأ صب عينات المقاومة؟',['خلال 15 دقيقة من تركيب العينة المركّبة','خلال 5 دقائق','بعد ساعتين','بعد ساعة'],0,'البند 5.1.2.','التوقيت',1],
['ما الحماية المطلوبة للعينة قبل الاختبار؟',['من الشمس والريح وسرعة التبخر والتلوث','لا شيء','تغطيتها بالماء','تركها للجفاف'],0,'البند 5.1.2.','التوقيت',0]];
const B1=[['خلاطة شاحنة: متى يجوز أخذ العينة؟',['بعد اكتمال إضافة الماء والمضافات وبعيداً عن أول التصريف وآخره','فور فتح البوابة','من آخر ما يخرج','قبل إضافة الملدّن'],0,'البند 6.2.3 (وC31 البند 7.1: بعد كل التعديلات).','طرق الأخذ',1,'العينة تمثّل الخلطة النهائية.'],
['كيف يُضبط معدل تصريف الشاحنة أثناء الأخذ؟',['بسرعة دوران الدرّام لا بحجم فتحة البوابة','بفتح البوابة جزئياً','بإمالة الشاحنة','لا يهم'],0,'البند 6.2.3.','طرق الأخذ',0],
['كيف تجمع الجزء من تيار التصريف؟',['تمرير الوعاء كاملاً عبر التيار أو تحويل التصريف كله إليه','أخذ كمية من حافة التيار','الغرف من الكومة بعد انتهاء التصريف','ملء المغرفة من السطح'],0,'البند 6.2.1: دون تقييد التدفق بما يسبب فصلاً حبيبياً.','طرق الأخذ',0],

['خلاط مستمر: متى تبدأ الأخذ؟',['بعد تصريف 140 L [5 ft³] على الأقل وبعد كل تعديلات النسب','فور التشغيل','بعد لتر واحد','بعد 10 لترات'],0,'البند 6.2.4.','طرق الأخذ',0],

['بدأت صب الأسطوانات بعد 25 دقيقة من تركيب العينة. التقييم؟',['مخالف: الحد 15 دقيقة (5.1.2)','مقبول','مقبول في الصيف','يكفي التغطية'],0,'البند 5.1.2.','التوقيت',1],
['تركت العينة مكشوفة للشمس والريح 10 دقائق. أين الخلل؟',['5.1.2 يلزم حمايتها من الشمس والريح والتبخر والتلوث','لا خلل','في الوعاء','في الأسمنت'],0,'التبخر يغيّر القوام فلا تمثّل العينة الخرسانة المسلّمة.','التوقيت',0]];
const B3=[['متى تُجرى الغربلة الرطبة؟',['عندما يكون الركام أكبر مما يناسب القوالب أو المعدات','دائماً','أبداً','لخفض الهواء'],0,'البند 7.1.','الغربلة',0],
['ماذا تفعل بالركام المحجوز على المنخل؟',['يُزال ويُتخلص منه دون مسح الملاط الملتصق به','تمسح ملاطه ثم تلقيه','تعيده للعينة','تطحنه'],0,'البند 7.4.1.','الغربلة',0],
['ما أقصى سمك لطبقة الركام المحجوزة على المنخل؟',['حبة واحدة','5 حبات','طبقة سميكة','لا يهم'],0,'البند 7.4.1: ضع على المنخل من الخرسانة بقدر ما يترك طبقة بسمك حبة.','الغربلة',0],
['أين يسقط الخليط المار من المنخل؟',['وعاء خلط مرطّب مسبقاً أو سطح رطب نظيف غير ماص','لوح خشب جاف','تربة','سلة'],0,'البند 7.4.1.','الغربلة',0],
['بعد إزالة الركام الكبير؟',['يُعاد الخلط بأقل قدر لازم ثم يبدأ الاختبار فوراً','يُخلط لساعة','تُخزَّن العينة','تُترك لتستقر'],0,'البند 7.4.1.','الغربلة',0],
['اختبار الوزن الحجمي لحساب المردود: على أي خرسانة؟',['الخلطة الكاملة دون غربلة','المغربلة دائماً','لا فرق','المغربلة للهواء فقط'],0,'البند 7.1: استثناء اختبارات الوزن الحجمي لحسابات المردود على الخلطة الكاملة.','الغربلة',0],

['جزء أُخذ من أول ما خرج من الشاحنة. القرار؟',['مخالف: لا أجزاء من أول أو آخر التصريف (6.2.3)','سليم إن كان سريعاً','سليم إن خُلط جيداً','يُحسب جزءاً ثانياً'],0,'ملاحظة 3 (توضيحية): لا قبل 10% ولا بعد 90% من الدفعة.','المراقبة',1]];
const WS=['أخذ العينة المركّبة وفق 6.2','وضع الخرسانة على المنخل المحدد بطبقة بسمك حبة','هز المنخل حتى لا يبقى مادة أدق عليه','إزالة الركام المحجوز دون مسح ملاطه','سقوط المار في وعاء مرطّب أو سطح رطب غير ماص','كشط الملاط الملتصق بمعدات الغربلة وإضافته للخلطة','إعادة الخلط بأقل قدر لازم','البدء بالاختبار فوراً'];
const OR=['التأكد من اكتمال إضافة الماء والمضافات','تجاوز الجزء الأول من التصريف','أخذ جزأين أو أكثر من المنتصف على فترات منتظمة','دمج الأجزاء وإعادة الخلط بأقل قدر','نقل العينة وحمايتها من الشمس والريح','بدء الهبوط والحرارة والهواء خلال 5 دقائق','بدء صب العينات خلال 15 دقيقة من تركيب العينة'];
// ---- المراحل
function s0(){it('استلام المهمة','وصلت شاحنة خرسانة جاهزة إلى الموقع، والمطلوب عينة تمثّلها لاختبارات الهبوط والحرارة والهواء وصب عينات المقاومة. إن لم تكن العينة ممثّلة فكل نتيجة بعدها بلا قيمة.',B0,20)}
function s1(){let p=0,got=[],tm=null;
M.innerHTML=`<div class=card><h2>أخذ العينة من شاحنة الخلط</h2><p>اضغط «ابدأ التصريف» ثم «خذ جزءاً» في اللحظات المناسبة (جزءان على الأقل) ثم «أنهِ العينة». كل ثانية = دقيقة محاكاة، والتصريف 20 دقيقة (توضيحي).</p><div class=trk id=tk>${S.mode=='t'?'<i class=z style="right:0;width:10%"></i><i class=z style="left:0;width:10%"></i>':''}<div id=bar></div></div><p id=stt>الحالة: لم يبدأ التصريف</p><p>الزمن: <b id=tm>0</b> د | الأجزاء: <b id=nn>0</b></p><label>طريقة الأخذ<select id=tc><option>تمرير الوعاء عبر كامل التيار</option><option>غرف من حافة التيار</option></select></label><button class=pri id=bs>ابدأ التصريف</button><button id=bt disabled>خذ جزءاً</button><button id=bf disabled>أنهِ العينة</button><div id=f></div></div>`;
const stop=()=>{clearInterval(tm);tm=null},upd=()=>{$('#bar').style.width=p+'%';$('#tm').textContent=(p*.2).toFixed(1);$('#nn').textContent=got.length;$('#stt').textContent=p<5?'الحالة: إضافة الماء/الملدّن جارية':p>=100?'الحالة: انتهى التصريف':'الحالة: التصريف جارٍ'};
$('#bs').onclick=()=>{$('#bs').disabled=1;$('#bt').disabled=0;$('#bf').disabled=0;tm=setInterval(()=>{p=Math.min(100,p+.5);upd();if(p>=100){stop();$('#bt').disabled=1}},100)};
$('#bt').onclick=()=>{got.push([p,$('#tc').selectedIndex]);const m=document.createElement('i');m.className='mk';m.style.right=p+'%';$('#tk').appendChild(m);upd();good()};
$('#bf').onclick=()=>{stop();const e=[],ps=got.map(g=>g[0]);
if(got.length<2)e.push(['أقل من جزأين','6.2.3: عينة مركّبة من جزأين أو أكثر على فترات منتظمة','جزءان على الأقل','عينة لا تمثل تغير التصريف']);
if(ps.some(x=>x<5))e.push(['أخذت قبل اكتمال الإضافات','6.2.3: لا عينة قبل إضافة كل الماء والمضافات','انتظر اكتمال الإضافات','لا تمثل الخلطة النهائية']);
if(ps.some(x=>x>=5&&x<10))e.push(['جزء من أول التصريف','6.2.3: لا أجزاء من أول التصريف (ملاحظة 3 توضيحياً: لا قبل 10%)','خذ من الوسط','أول التصريف غير ممثل']);
if(ps.some(x=>x>90))e.push(['جزء من آخر التصريف','6.2.3: لا أجزاء من آخر التصريف (ملاحظة 3 توضيحياً: لا بعد 90%)','خذ من الوسط','آخر التصريف غير ممثل']);
if(got.length>1&&(Math.max(...ps)-Math.min(...ps))*.2>15)e.push(['تجاوز 15 دقيقة بين أول وآخر جزء','5.1: لا يزيد عن 15 دقيقة','قرّب الأجزاء زمنياً','مخالفة حد الزمن']);
if(got.some(g=>g[1]==1))e.push(['طريقة أخذ خاطئة','6.2.1: تمرير الوعاء عبر كامل التيار أو تحويله كله','مرّر الوعاء عبر التيار كله','عينة منحازة لجزء من التيار']);
S.err+=e.length;hud();
if(e.length){bad();$('#f').innerHTML=e.map(fm).join('')+'<div class="fb b">العينة غير مطابقة وتُعاد على شاحنة جديدة.</div><button class=pri id=rt>أعد المحاولة</button>';$('#rt').onclick=s1;return}
good();S.xp+=60;if(S.mode!='t')S.ok2=1;hud();sv();$('#f').innerHTML=`<div class="fb g"><b>✓ عينة مطابقة.</b> أخذت ${got.length} أجزاء من وسط التصريف بطريقة صحيحة.</div><button class=pri id=nx>أسئلة طرق الأخذ</button>`;$('#nx').onclick=()=>quiz(B1,()=>{S.xp+=20;nxt()})}}
function s2(){it('التوقيت وحماية العينة','بعد أخذ العينة يبدأ العد التنازلي: حدود الزمن في C172 البند 5 تحمي تمثيل العينة.',B2,25)}
function s3(){M.innerHTML=`<div class=card><h2>الغربلة الرطبة</h2><p>عندما يكون الركام أكبر مما يناسب القوالب أو المعدات، تُغربل العينة رطباً (البند 7). رتّب الخطوات أولاً.</p><button class=pri id=b>ابدأ</button></div>`;
$('#b').onclick=()=>ord(WS,c=>{const f=$('#f');if(c==WS.length){good();S.xp+=40;hud();f.innerHTML=`<div class="fb g">✓ ترتيب صحيح.</div><button class=pri id=nx>أسئلة الغربلة</button>`;$('#nx').onclick=()=>quiz(B3,()=>{S.xp+=20;nxt()})}
else{bad();S.err++;hud();f.innerHTML=`<div class="fb b">✗ ${c}/${WS.length} في موضعها. ${S.mode=='t'?'الترتيب الصحيح: '+WS.join(' ← '):'أعد المحاولة.'}</div><button class=pri id=rt>أعد</button>`;$('#rt').onclick=s3}},'رتّب خطوات الغربلة الرطبة')}
function s4(){it('اختبار المهندس المشرف','سيناريوهات من الموقع: اكتشف الخطأ واتخذ القرار.',B4,30)}
function s5(){M.innerHTML=`<div class=card><h2>الامتحان الشامل</h2><p>14 سؤالاً ثم ترتيب خطوات أخذ العينة، بلا تلميحات. الشهادة تشترط ≥80% وعدم الإخفاق في بند جوهري وإنجاز محاكاة أخذ العينة دون أخطاء في وضع التطبيق أو التحدي.</p><button class=pri id=b>ابدأ الامتحان</button></div>`;
$('#b').onclick=()=>{FL=[];MS=[];const m=S.mode;S.mode='p';const Q=sh([].concat(B0,B1,B2,B3,B4)).slice(0,14);quiz(Q,r=>{S.mode=m;ord(OR,c=>{if(c<5){FL.push('ترتيب الخطوات');MS.push('ترتيب الخطوات')}res(r+Math.round(c/OR.length*3),Q.length+3)},'رتّب خطوات أخذ العينة والاختبار')})}}
function res(p,tot){const pc=Math.round(p/tot*100),cr=[...new Set(FL)],ms=[...new Set(MS)],pass=pc>=80&&!cr.length&&S.ok2,why=[];
if(pc<80)why.push('الدرجة دون 80%');if(cr.length)why.push('إخفاق في بنود جوهرية: '+cr.join('، '));if(!S.ok2)why.push('لم تُنجز محاكاة أخذ العينة بنجاح في وضع التطبيق أو التحدي');
if(pass){S.cert=1;S.xp+=100;sv();hud()}
M.innerHTML=`<div class=card><h2>${pass?'اجتزت الامتحان':'لم تتحقق شروط الإتقان'}</h2><p>الدرجة ${p}/${tot} — نسبة الإتقان ${pc}%</p>${why.length?`<div class="fb b">${why.join('<br>')}</div>`:''}<p><b>نقاط القوة:</b> ${['مفاهيم','طرق الأخذ','التوقيت','الغربلة','المراقبة'].filter(x=>!ms.includes(x)).join('، ')||'—'}</p><p><b>تحتاج تدريباً في:</b> ${ms.join('، ')||'لا شيء'}</p>${pass?`<button class=pri id=ce>عرض الشهادة</button>`:''}<button onclick=go(1)>إعادة المحاكاة</button><button onclick=s5()>إعادة الامتحان</button></div>`;
if(pass)$('#ce').onclick=()=>{pr(`<div class=rep style="text-align:center"><h1>شهادة إتقان أخذ عينة الخرسانة الطازجة</h1><p>تشهد أكاديمية المختبر بأن</p><h2>${S.name}</h2><p>أتقن إجراء أخذ العينة وفق ASTM C172/C172M – 25 بنسبة ${pc}% (تدريب تعليمي، وليست شهادة اعتماد رسمية)</p><p>${new Date().toLocaleDateString('ar')} — الخبرة ${S.xp}</p><p>تصميم اللعبة: أحمد شاكر</p></div>`);document.body.classList.add('pp');print();document.body.classList.remove('pp')}}
hud();start();
</script></body></html>
